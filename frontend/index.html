<style>

.hd h1{font-size:17px;margin:0;line-height:1.1}.hd .eb{display:block}
.tabs{display:flex;gap:2px;background:var(--p2);border:1px solid var(--bd);padding:3px;border-radius:999px}.tabs a{padding:5px 13px;border-radius:999px;cursor:pointer;color:var(--mu);transition:all .2s;white-space:nowrap}.tabs a.on{background:var(--ac);color:#04121a;font-weight:600}.tabs a:hover:not(.on){color:var(--tx)}
.kp{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}.kc{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:5px 14px;text-align:center;cursor:pointer;transition:border-color .2s,transform .2s;min-width:84px}.kc:hover{border-color:var(--ac);transform:translateY(-1px)}.kc b{font-size:19px;display:block;line-height:1.2}.kc span{font-size:9px;letter-spacing:.1em;color:var(--mu);text-transform:uppercase}

.cc{display:grid;grid-template-columns:340px 1fr 380px;height:100%}
.col{background:var(--pn);overflow-y:auto;min-height:0}.col.l{border-right:1px solid var(--bd)}.col.rr{border-left:1px solid var(--bd);padding:16px}
.ph{padding:14px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--pn);z-index:2}.ph h3,.sl{font-size:10px;letter-spacing:.2em;color:var(--mu);text-transform:uppercase;margin:0 0 8px;font-weight:600}.ph .fl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{margin:10px 12px;padding:12px;background:var(--p2);border:1px solid var(--bd);border-radius:10px;cursor:pointer;transition:transform .18s,border-color .18s;animation:up .3s both}.card:hover{transform:translateX(3px);border-color:var(--ac)}.card.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.card.crit{border-color:var(--cr)}
.card .id{font:11px ui-monospace,monospace;color:var(--mu)}.card b{display:block;margin:4px 0 2px;font-size:14px}.card small{color:var(--mu)}
.bd{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid}
.P-Critical{color:var(--cr);border-color:var(--cr)}.P-High{color:var(--hi);border-color:var(--hi)}.P-Medium{color:var(--wa);border-color:var(--wa)}.P-Low{color:var(--lo);border-color:var(--lo)}.st{color:var(--ac);border-color:var(--ac)}
.mp{position:relative;background:var(--bg);min-height:360px;overflow:hidden}.mp svg{width:100%;height:100%;display:block;position:absolute;inset:0}
svg text{fill:var(--mu);font-size:9px;pointer-events:none}.mk{cursor:pointer;transition:opacity .25s}.mk:hover{opacity:.8}.rg{animation:ring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ly{position:absolute;right:12px;top:12px;width:210px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px;z-index:3;animation:up .4s both;max-height:calc(100% - 24px);overflow:auto}
.tg{display:flex;justify-content:space-between;align-items:center;background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;margin-bottom:5px;cursor:pointer;font-size:12px;transition:border-color .2s}.tg:hover{border-color:var(--ac)}.tg i{font-style:normal;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok);color:#04121a;transition:all .2s}.tg.off i{background:var(--bd);color:var(--mu)}.tg.dis{opacity:.5;cursor:default}
.mb{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;z-index:3;font-size:11px;color:var(--mu);background:var(--pn);border:1px solid var(--bd);padding:6px 10px;border-radius:999px}.mb i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px 0 6px}
.tbs{display:flex;gap:4px;margin:12px 0}.tbs a{padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:all .2s}.tbs a.on{background:var(--p2);color:var(--ac)}
.rec{background:var(--p2);border:1px solid var(--ac);border-radius:10px;padding:12px;margin-bottom:12px;color:var(--tx)}
.ai{border:1px dashed var(--wa);border-radius:10px;padding:10px;font-size:12px;color:var(--mu);margin-bottom:12px}
.tl{border-left:2px solid var(--bd);margin:6px 0 0 5px;padding-left:12px}.tl div{margin:8px 0;position:relative;animation:up .3s both}.tl div:before{content:"";position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--ac)}.tl small{color:var(--mu)}
.em{display:grid;place-items:center;height:60%;text-align:center;color:var(--mu);padding:20px}
.dp{padding:20px;max-width:1200px;margin:0 auto}h2{font-size:18px;margin:0 0 14px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.cd{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:16px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}.bar em{width:120px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.bar div{height:8px;background:linear-gradient(90deg,var(--ac),#3b82f6);border-radius:4px;animation:grow .7s ease both}.bar s{text-decoration:none;color:var(--mu);font-size:12px}
.ok{border-left:3px solid var(--ok);margin-top:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);background:var(--p2);border:1px solid var(--ac);padding:9px 16px;border-radius:999px;opacity:0;transition:all .25s;z-index:30;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.cc{grid-template-columns:300px 1fr}.col.rr{grid-column:1/3;border-left:0;border-top:1px solid var(--bd)}}
@media(max-width:760px){#app{height:auto;min-height:100vh}.cc{display:block}.col{max-height:420px}.mp{height:380px}.kp{margin-left:0}.ly{width:170px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="login"><div class="lb"><div class="eb">AISVIP · BORNO STATE</div><h1>Smart City Intelligence Platform</h1><div class="tag">Serving Humanity with Humility.</div>
<div class="nt">Front-end foundation. This sign-in is a <b>demo role switcher</b>, not real authentication[cite: 2].</div>
<label>Demo role</label><select id="rl"></select><button class="btn" style="width:100%;margin-top:18px" onclick="enter()">Enter platform</button></div></div>
<div id="app"><div class="hd"><div><span class="eb">AISVIP · BORNO STATE</span><h1>Smart City Intelligence</h1></div><div class="tabs" id="tb"></div><div class="kp" id="kp"></div><span class="pill">DEMO DATA</span><span id="who" style="color:var(--mu)"></span><button class="btn g" onclick="location.reload()">Sign out</button></div><div id="pg"></div></div><div id="toast"></div>
<script>
const ROLES={super:["Super Administrator","*"],state:["State Administrator","*"],lga:["LGA Administrator (Jere)","*",{lga:"Jere"}],rev:["Incident Reviewer","*"],off:["Department Officer (Drainage & Flood)","cmd,dash",{dept:"Drainage & Flood"}],gis:["GIS / Data Analyst","cmd,dash"],field:["Field Officer (Drainage & Flood)","cmd",{dept:"Drainage & Flood"}],pub:["Public User / Resident","rep,track"]};
const TABS=[["cmd","Command Center"],["dash","Dashboard"],["rep","Submit Report"],["track","Track"],["plan","Administration"]];
const LGA={"Maiduguri Metropolitan Council":[11.83,13.15],Jere:[11.88,13.2],Konduga:[11.65,13.42],Bama:[11.52,13.69],Gwoza:[11.08,13.69],Dikwa:[12.04,13.92],Monguno:[12.67,13.61],Damboa:[11.16,12.76],Biu:[10.61,12.19],Ngala:[12.35,14.18],Kukawa:[12.92,13.57]};
const ALLLGA="Maiduguri Metropolitan Council,Jere,Bama,Konduga,Mafa,Dikwa,Ngala,Monguno,Gwoza,Biu,Damboa,Bayo,Hawul,Kwaya Kusar,Shani,Bursari,Gubio,Guzamala,Kukawa,Marte,Mobbar,Abadam,Askira/Uba,Chibok,Kaga,Kala/Balge,Magumeri".split(",");
const CAT={Drainage:"Drainage & Flood",Roads:"Roads & Transport",Waste:"Environment & Waste",Water:"Water Resources",Lighting:"Electricity & Lighting",Flooding:"Drainage & Flood","Public facilities":"Public Works"};
const ST=["Submitted","Awaiting Review","Under Verification","Clarification Required","Verified","Rejected","Pending Assignment","Assigned","In Progress","Resolved","Closed","Reopened"];
const NOW=Date.now(),DAY=864e5;
const SEED=[["Blocked drainage beside primary school","Drainage","Jere","Medium","Verified",5],["Deep pothole on main access road","Roads","Maiduguri Metropolitan Council","High","In Progress",9],["Uncollected refuse at market edge","Waste","Maiduguri Metropolitan Council","Medium","Assigned",4],["Streetlights out on junction","Lighting","Maiduguri Metropolitan Council","Low","Pending Assignment",3],["Broken water standpipe","Water","Konduga","High","Assigned",12],["Flooding after rainfall at settlement","Flooding","Jere","Critical","In Progress",6],["Cracked public clinic wall","Public facilities","Bama","Medium","Awaiting Review",2],["Overflowing drain near road","Drainage","Maiduguri Metropolitan Council","High","Resolved",20],["Road erosion at culvert","Roads","Biu","High","Verified",8],["Illegal dump site growing","Waste","Jere","Medium","Resolved",25],["Water pipe leakage","Water","Gwoza","Low","Submitted",1],["Streetlight pole leaning","Lighting","Dikwa","Medium","Closed",30],["Blocked drainage at roadside","Drainage","Jere","Medium","Assigned",7],["Damaged public toilet block","Public facilities","Monguno","Low","Under Verification",2]].map((r,i)=>({id:"AISVIP-BOR-2026-"+String(i+1).padStart(6,"0"),t:r[0],c:r[1],l:r[2],p:r[3],s:r[4],d:CAT[r[1]],ts:NOW-r[5]*DAY,due:NOW-r[5]*DAY+7*DAY,demo:1,lat:LGA[r[2]][0]+((i*37%11)-5)*.012,lon:LGA[r[2]][1]+((i*53%11)-5)*.012,desc:"Demonstration record. Not a genuine citizen submission.",h:[[NOW-r[5]*DAY,"Submitted (demo seed)","System"]]}));
let U=null,V="cmd",INC=SEED.slice(),S={sel:null,tab:"Triage",f:{},ly:{hot:1,act:1,res:1,ref:1,grid:1}},PV={};
try{INC=INC.concat(JSON.parse(localStorage.getItem("aisvip_rep")||"[]"))}catch(e){}
const $=id=>document.getElementById(id),W=760,H=440;
$("rl").innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");
const can=p=>U.ok=="*"||U.ok.split(",").includes(p)||(p=="plan"&&U.k!="pub"&&U.ok=="*");
function enter(){const k=$("rl").value;U={k,n:ROLES[k][0],ok:ROLES[k][1],sc:ROLES[k][2]||{}};$("login").style.display="none";$("app").classList.add("on");$("who").textContent=U.n;go(U.k=="pub"?"rep":"cmd")}
const vis=()=>INC.filter(i=>(!U.sc.lga||i.l==U.sc.lga)&&(!U.sc.dept||i.d==U.sc.dept));
const done=i=>["Resolved","Closed","Rejected"].includes(i.s),od=i=>i.due<NOW&&!done(i);
const ago=t=>{const d=Math.round((NOW-t)/DAY);return d>0?d+"d ago":"today"};
const fmt=t=>new Date(t).toLocaleString("en-NG",{timeZone:"Africa/Lagos",dateStyle:"medium",timeStyle:"short"});
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("on"),2400)}
function cnt(el,to){const from=PV[el.id]||0;PV[el.id]=to;if(isNaN(to)||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=to;return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/600);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
function kpis(){const a=vis(),r=a.filter(i=>["Resolved","Closed"].includes(i.s)).length,K=[["k1","Active",a.filter(i=>!done(i)&&!["Resolved","Closed"].includes(i.s)).length,{act:1}],["k2","Critical",a.filter(i=>i.p=="Critical"&&!done(i)).length,{pr:"Critical"}],["k3","Awaiting review",a.filter(i=>["Submitted","Awaiting Review","Under Verification"].includes(i.s)).length,{st:"review"}],["k4","Overdue",a.filter(od).length,{od:1}],["k5","Resolved %",a.length?Math.round(r/a.length*100):0,{}]];
if(!$("k1"))$("kp").innerHTML=K.map(k=>`<div class="kc" onclick='S.f=${JSON.stringify(k[3])};go("cmd")'><b id="${k[0]}">0</b><span>${k[1]}</span></div>`).join("");K.forEach(k=>cnt($(k[0]),k[2]))}
function go(p){V=p;$("tb").innerHTML=TABS.filter(t=>can(t[0])).map(t=>`<a class="${t[0]==p?"on":""}" onclick="go('${t[0]}')">${t[1]}</a>`).join("");kpis();const m={cmd,dash,rep,track,plan}[p];m();const c=$("pg").firstElementChild;c&&c.classList.add("fade")}
function pass(i){const f=S.f,q=(f.q||"").toLowerCase();return(!f.pr||i.p==f.pr)&&(!f.cat||i.c==f.cat)&&(!f.s||i.s==f.s)&&(!f.st||(f.st=="review"?["Submitted","Awaiting Review","Under Verification"].includes(i.s):[f.st].includes(i.s)))&&(!f.act||(!done(i)&&!["Resolved","Closed"].includes(i.s)))&&(!f.od||od(i))&&(!f.l||i.l==f.l)&&(!q||(i.id+i.t+i.l).toLowerCase().includes(q))}
function cmd(){const o=(n,a)=>`<select onchange="S.f.${n}=this.value;queue();map()"><option value="">${a[0]}</option>${a[1].map(x=>`<option ${S.f[n]==x?"selected":""}>${x}</option>`).join("")}</select>`;
$("pg").innerHTML=`<div class="cc"><div class="col l"><div class="ph"><h3>Incident queue</h3><div style="font-size:22px;font-weight:700;margin-bottom:10px"><span id="qn">0</span> shown</div><input placeholder="Search reference, title, LGA…" value="${S.f.q||""}" oninput="S.f.q=this.value;queue();map()" style="margin-bottom:6px"><div class="fl">${o("s",["All statuses",ST])}${o("pr",["All priorities",["Critical","High","Medium","Low"]])}</div><div style="margin-top:6px">${o("cat",["All categories",Object.keys(CAT)])}</div></div><div id="q"></div></div><div class="mp" id="mp"></div><div class="col rr" id="dt"></div></div>`;queue();map(1);det()}
function queue(){const a=vis().filter(pass).sort((x,y)=>({Critical:0,High:1,Medium:2,Low:3}[x.p]-{Critical:0,High:1,Medium:2,Low:3}[y.p])||y.ts-x.ts);cnt($("qn"),a.length);$("q").innerHTML=a.map((i,n)=>`<div class="card ${i.p=="Critical"?"crit":""} ${S.sel==i.id?"on":""}" style="animation-delay:${Math.min(n,12)*25}ms" onclick="pick('${i.id}')"><div style="display:flex;justify-content:space-between;gap:6px"><span class="id">${i.id.slice(-10)}${i.demo?" · demo":""}</span><span class="bd P-${i.p}">${i.p}</span></div><b>${i.t}</b><small>${i.c} · ${i.l}</small><div style="margin:8px 0 2px;display:flex;justify-content:space-between;align-items:center"><span class="bd st">${i.s}</span><small>${od(i)?'<span style="color:var(--cr)">Overdue · </span>':""}${ago(i.ts)}</small></div></div>`).join("")||'<div class="em">No incidents match these filters.</div>'}
function pick(id){S.sel=id;S.tab="Triage";queue();det();const i=INC.find(x=>x.id==id);zoom(i)}
let VB={x:0,y:0,w:W,h:H};const px=o=>40+(o-12)/2.4*(W-80),py=a=>H-30-(a-10.4)/2.8*(H-60);
const col=i=>["Resolved","Closed"].includes(i.s)?"var(--ok)":{Critical:"var(--cr)",High:"var(--hi)",Medium:"var(--wa)",Low:"var(--lo)"}[i.p];
function map(init){const a=vis().filter(pass),L=S.ly;if(init){VB={x:0,y:0,w:W,h:H}}let g="";if(L.grid){for(let o=12;o<=14.4;o+=.4)g+=`<line x1="${px(o)}" x2="${px(o)}" y1="0" y2="${H}" stroke="var(--bd)" stroke-width=".5"/>`;for(let t=10.4;t<=13.2;t+=.4)g+=`<line y1="${py(t)}" y2="${py(t)}" x1="0" x2="${W}" stroke="var(--bd)" stroke-width=".5"/>`}
const hot=L.hot?a.map(i=>`<circle cx="${px(i.lon)}" cy="${py(i.lat)}" r="26" fill="url(#hg)"/>`).join(""):"",ref=L.ref?Object.entries(LGA).map(([n,c])=>`<circle cx="${px(c[1])}" cy="${py(c[0])}" r="2" fill="var(--mu)"/><text x="${px(c[1])+5}" y="${py(c[0])-4}">${n.replace(" Metropolitan Council"," MMC")}</text>`).join(""):"";
const mk=a.filter(i=>done(i)||["Resolved","Closed"].includes(i.s)?L.res:L.act).map(i=>{const c=col(i),x=px(i.lon),y=py(i.lat),on=S.sel==i.id;return`<g class="mk" onclick="pick('${i.id}')">${i.p=="Critical"&&!["Resolved","Closed"].includes(i.s)?`<circle class="rg" cx="${x}" cy="${y}" r="7" fill="none" stroke="${c}" stroke-width="1.5"/>`:""}<circle data-r="${on?9:6}" cx="${x}" cy="${y}" r="${on?9:6}" fill="${c}" stroke="${on?"var(--tx)":"var(--bg)"}" stroke-width="${on?2:1.5}"><title>${i.id}: ${i.t}</title></circle></g>`}).join("");
const tg=(k,n)=>`<div class="tg ${L[k]?"":"off"}" onclick="S.ly.${k}=${L[k]?0:1};map()">${n}<i>${L[k]?"ON":"OFF"}</i></div>`;
$("mp").innerHTML=`<svg id="sv" viewBox="${VB.x} ${VB.y} ${VB.w} ${VB.h}" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="hg"><stop offset="0" stop-color="#f97316" stop-opacity=".45"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient></defs>${g}${hot}${ref}${mk}</svg><div class="ly"><h3 class="sl">Layers</h3>${tg("act","Active incidents")}${tg("res","Resolved")}${tg("hot","Heatmap")}${tg("ref","LGA reference points")}${tg("grid","Lat/lon grid")}<div class="tg dis">LGA &amp; ward boundaries<i style="background:var(--bd);color:var(--mu)">LATER</i></div></div><div class="mb"><button class="btn g" style="padding:3px 10px" onclick="S.sel=null;queue();det();zoom(null)">Reset view</button><i style="background:var(--cr)"></i>Critical<i style="background:var(--hi)"></i>High<i style="background:var(--wa)"></i>Medium<i style="background:var(--lo)"></i>Low<i style="background:var(--ok)"></i>Resolved</div><div class="mb" style="left:auto;right:12px;bottom:12px;max-width:340px;border-radius:10px;font-size:10px">Boundaries and basemap unavailable in this preview. Dots are approximate LGA points; incident positions are illustrative.</div>`}
function zoom(i){const sv=$("sv");if(!sv)return;const T=i?{w:200,h:118,x:px(i.lon)-100,y:py(i.lat)-59}:{x:0,y:0,w:W,h:H},F={...VB},t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/650),e=1-Math.pow(1-p,3);VB={x:F.x+(T.x-F.x)*e,y:F.y+(T.y-F.y)*e,w:F.w+(T.w-F.w)*e,h:F.h+(T.h-F.h)*e};sv.setAttribute("viewBox",`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);const s=VB.w/W;sv.querySelectorAll("circle[data-r]").forEach(c=>c.setAttribute("r",c.dataset.r*Math.max(s,.45)));if(p<1)requestAnimationFrame(f)})(t0)}
const FLOW={Submitted:["Awaiting Review"],"Awaiting Review":["Under Verification","Rejected"],"Under Verification":["Verified","Rejected","Clarification Required"],Verified:["Pending Assignment"],"Pending Assignment":["Assigned"],Assigned:["In Progress"],"In Progress":["Resolved"],Resolved:["Closed","Reopened"],Closed:["Reopened"],Reopened:["Assigned"],Rejected:[],"Clarification Required":["Under Verification"]};
const WHO={"Awaiting Review":"rev","Under Verification":"rev",Rejected:"rev","Clarification Required":"rev",Verified:"rev","Pending Assignment":"rev",Assigned:"adm","In Progress":"off",Resolved:"off",Closed:"rev",Reopened:"rev"};
const NEXT={Submitted:"Queue for reviewer attention.","Awaiting Review":"Reviewer to open the report, check evidence and confirm location.","Under Verification":"Confirm details, then verify, reject or request clarification.","Clarification Required":"Await reporter response, then resume verification.",Verified:"Mark pending assignment, then assign to the responsible department.","Pending Assignment":"Assign to a department and set a deadline.",Assigned:"Department officer to accept and start work.","In Progress":"Record inspection and evidence, then submit resolution.",Resolved:"Reviewer or supervisor validates and closes, or reopens.",Closed:"No action required.",Rejected:"No action required.",Reopened:"Reassign for further work."};
const allowed=s=>{const g=WHO[s],k=U.k;if(["super","state"].includes(k))return 1;if(g=="rev")return["rev","lga"].includes(k);if(g=="adm")return k=="lga";return["off","field"].includes(k)};
function det(){const i=INC.find(x=>x.id==S.sel),el=$("dt");if(!el)return;if(!i){el.innerHTML='<div class="em"><div><div style="font-size:30px">◎</div>Select an incident from the queue or map to see triage, details and history.</div></div>';return}
const T=S.tab,tabs=["Triage","Details","Timeline"].map(t=>`<a class="${t==T?"on":""}" onclick="S.tab='${t}';det()">${t}</a>`).join("");
const body=T=="Triage"?`<div class="sl">Recommended next step</div><div class="rec">${NEXT[i.s]}<br><small style="color:var(--mu)">Rule-based guidance.</small></div><div class="ai"><b style="color:var(--wa)">AI analysis: connected via backend.</b><br>Priority: ${i.p}.</div><div class="sl">Actions</div><div style="display:flex;gap:6px;flex-wrap:wrap">${FLOW[i.s].filter(allowed).map(s=>`<button class="btn ${s=="Rejected"?"r":""}" onclick="mv('${i.id}','${s}')">${s}</button>`).join("")||'<small style="color:var(--mu)">No actions available to your role at this status.</small>'}</div>`:T=="Details"?`<p>${i.desc}</p>${[["Category",i.c],["LGA",i.l],["Department",i.d||"Unassigned"],["Coordinates",i.lat.toFixed(3)+", "+i.lon.toFixed(3)],["Submitted",fmt(i.ts)],["Due",fmt(i.due)]].map(r=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)"><span style="color:var(--mu)">${r[0]}</span><span style="text-align:right">${r[1]}</span></div>`).join("")}`:`<div class="tl">${i.h.slice().reverse().map(h=>`<div><b>${h[1]}</b><br><small>${fmt(h[0])} · ${h[2]}</small></div>`).join("")}</div>`;
el.innerHTML=`<div class="fade"><div style="display:flex;justify-content:space-between"><span class="card id" style="all:unset;font:11px ui-monospace,monospace;color:var(--mu)">${i.id}</span><span class="bd P-${i.p}">${i.p}</span></div><h2 style="margin:10px 0 4px;font-size:21px">${i.t}</h2><span class="bd st">${i.s}</span>${od(i)?' <span class="bd P-Critical">Overdue</span>':""}<div class="tbs">${tabs}</div>${body}</div>`}
function mv(id,s){const i=INC.find(x=>x.id==id);i.s=s;i.h.push([Date.now(),s,U.n]);try{localStorage.setItem("aisvip_rep",JSON.stringify(INC.filter(x=>!x.demo)))}catch(e){}kpis();queue();map();det();toast("Status updated and logged")}
function bars(t,keys,fn,f){const r=keys.map(k=>[k,fn(k)]).filter(x=>x[1]),m=Math.max(1,...r.map(x=>x[1]));return`<div class="cd"><h3 class="sl">${t}</h3>${r.map(([k,v])=>`<div class="bar" onclick='S.f={${f}:${JSON.stringify(k)}};S.sel=null;go("cmd")'><em>${k}</em><div style="width:${v/m*120}px"></div><s>${v}</s></div>`).join("")||"<small>No records</small>"}</div>`}
function dash(){const a=vis();$("pg").innerHTML=`<div class="dp"><h2>Executive dashboard</h2><div class="nt">Figures reflect real records and visible entries. Click any bar to open it in the Command Center.</div><div class="gr">${bars("By status",ST,s=>a.filter(i=>i.s==s).length,"s")}${bars("By category",Object.keys(CAT),c=>a.filter(i=>i.c==c).length,"cat")}${bars("By LGA",[...new Set(a.map(i=>i.l))],l=>a.filter(i=>i.l==l).length,"l")}${bars("By priority",["Critical","High","Medium","Low"],p=>a.filter(i=>i.p==p).length,"pr")}</div></div>`}
function rep(){$("pg").innerHTML=`<div class="dp" style="max-width:600px"><h2>Submit a report</h2><div class="nt">No account needed. Reports save directly to your Render PostgreSQL database.</div><label>Category</label><select id="rc">${Object.keys(CAT).map(c=>`<option>${c}</option>`).join("")}</select><label>Title</label><input id="rt"><label>Description</label><textarea id="rd" rows="4"></textarea><label>LGA</label><select id="rl2">${ALLLGA.map(l=>`<option>${l}</option>`).join("")}</select><label>Community / street / landmark</label><input id="rs"><label>GPS (optional)</label><div style="display:flex;gap:6px"><input id="la" placeholder="Latitude"><input id="lo" placeholder="Longitude"><button class="btn g" style="white-space:nowrap" onclick="gps()">Use location</button></div><label>Optional phone (Nigerian)</label><input id="rp" placeholder="0803… or +234803…"><div style="margin-top:16px"><button class="btn" onclick="sub()">Submit report</button></div><div id="rr"></div></div>`}
function gps(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{la.value=p.coords.latitude.toFixed(5);lo.value=p.coords.longitude.toFixed(5)},()=>toast("Location unavailable")):toast("Not supported")}

async function sub() {
  const ph = rp.value.replace(/\s/g, "");
  if (!rt.value.trim() || rd.value.trim().length < 10) return toast("Add a title and a longer description");
  if (ph && !/^(\+234|0)[789][01]\d{8}$/.test(ph)) return toast("Invalid Nigerian phone number");

  const l = rl2.value;
  const b = LGA[l] || [11.83, 13.15];

  const payload = {
    title: rt.value,
    category: rc.value,
    lga: l,
    community: rs.value || l,
    description: rd.value,
    latitude: parseFloat(la.value) || b[0],
    longitude: parseFloat(lo.value) || b[1],
    phone: ph
  };

  try {
    const res = await fetch('https://aisvip-v1.onrender.com/api/v1/incidents', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (data.success) {
      const serverReport = data.data;

      INC.push({
        id: serverReport.id,
        t: serverReport.title,
        c: serverReport.category,
        l: serverReport.lga,
        p: serverReport.priority || "Medium",
        s: serverReport.status || "Submitted",
        d: CAT[serverReport.category] || "Public Works",
        ts: Date.now(),
        due: Date.now() + 7 * DAY,
        desc: serverReport.description,
        lat: parseFloat(serverReport.latitude) || b[0],
        lon: parseFloat(serverReport.longitude) || b[1],
        h: [[Date.now(), "Submitted", "Resident"]]
      });

      try {
        localStorage.setItem("aisvip_rep", JSON.stringify(INC.filter(x => !x.demo)));
      } catch (e) {}

      rr.innerHTML = `<div class="cd ok fade"><b>Report received</b><br>Reference: <b style="color:var(--ac)">${serverReport.id}</b><br>Category: ${serverReport.category} · Priority: ${serverReport.priority} · Status: ${serverReport.status}<br>Keep this reference number to track progress.</div>`;
      kpis();
      toast("Saved to PostgreSQL database!");
    } else {
      toast("Submission failed: " + data.error);
    }
  } catch (err) {
    console.error("API error:", err);
    toast("Backend connection error");
  }
}

function track(){$("pg").innerHTML=`<div class="dp" style="max-width:480px"><h2>Track a report</h2><input id="tq" placeholder="AISVIP-BOR-2026-000001"><div style="margin:12px 0"><button class="btn" onclick="tr()">Check status</button></div><div id="tr"></div></div>`}
function tr(){const i=INC.find(x=>x.id==tq.value.trim().toUpperCase());$("tr").innerHTML=i?`<div class="cd fade"><b>${i.id}</b><br>${i.c} · ${i.l}<br>Status: <span class="bd st">${i.s}</span><div class="tl">${i.h.map(h=>`<div>${h[1]}<br><small>${fmt(h[0])}</small></div>`).join("")}</div></div>`:"<small>No report found with that reference.</small>"}
function plan(){const P=["Statewide intelligence","Verification queue","Assignments","Field operations","Department response","AI Intelligence Centre","Geographic analysis","Incident trends","Analytics and exports","Users and roles","Organisations and departments","LGAs and wards","Incident categories","Notifications (SMS, email, WhatsApp)","AI configuration","System settings","Audit logs"];$("pg").innerHTML=`<div class="dp"><h2>Administration and planned modules</h2><div class="nt">Designed modules needing backend integration.</div><div class="gr">${P.map(p=>`<div class="cd" style="display:flex;justify-content:space-between">${p}<span class="bd P-Medium">Planned</span></div>`).join("")}</div></div>`}
</script></body></html>
